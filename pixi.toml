# =============================================================================
# Data Mining — Fall 2026
#
# ONE manifest for the whole course. Read this file top-to-bottom:
#
#   [dependencies]        the shared baseline every project inherits
#   [feature.<name>]      one project's extra packages and its tasks
#   [environments]        which features combine into a runnable environment
#
# Adding a project means adding a [feature.<name>.*] block and one line under
# [environments]. Nothing is copied between projects, so nothing can drift.
#
# Students never edit this file. They run `pixi install`, then `pixi run <task>`.
# =============================================================================

[workspace]
name = "data-mining-wmacevoy-fall-2026"
version = "2026.8.0"
description = "Course projects for Data Mining, Colorado Mesa University, Fall 2026"
authors = ["Warren MacEvoy <wmacevoy@gmail.com>"]
channels = ["conda-forge"]

# Every platform a student might bring to class. `pixi.lock` stores a solved,
# pinned package set for each one, so macOS/Windows/Linux all get the same
# versions. win-64 is native Windows -- no WSL required for these projects.
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

# -----------------------------------------------------------------------------
# Shared baseline. Every environment below inherits these automatically.
# Keep this list small: only things genuinely common to all course projects.
# -----------------------------------------------------------------------------
[dependencies]
python = "3.12.*"
pandas = ">=2.2,<3"
numpy = ">=1.26,<3"
pyarrow = ">=16"
python-dateutil = ">=2.9"
pytz = ">=2024.1"

# -----------------------------------------------------------------------------
# Developer tooling, shared by every project.
# -----------------------------------------------------------------------------
[feature.dev.dependencies]
pytest = ">=8"
ruff = ">=0.6"

# -----------------------------------------------------------------------------
# Project: colorado_river
#
# A Streamlit dashboard over the USGS Water Services API. Deltas from the
# baseline are just the web/plotting/HTTP stack.
# -----------------------------------------------------------------------------
[feature.colorado-river.dependencies]
streamlit = ">=1.37"
altair = ">=5.3"
httpx = ">=0.27"
matplotlib = ">=3.8"
watchdog = ">=4"          # lets Streamlit hot-reload on file save

[feature.colorado-river.tasks]
# `cwd` is relative to this manifest, so every task behaves the same no matter
# which directory the student happens to be sitting in.
app = { cmd = "streamlit run app.py", cwd = "colorado_river" }
px = { cmd = "python px.py", cwd = "colorado_river" }
meta = { cmd = "python meta.py", cwd = "colorado_river" }
# profile_raw.py, not profile.py: that name would shadow the standard library's
# `profile` module for anything run from colorado_river/.
profile = { cmd = "python profile_raw.py", cwd = "colorado_river" }
test = { cmd = "pytest -q", cwd = "colorado_river" }
lint = { cmd = "ruff check .", cwd = "colorado_river" }

# Clear the cached Parquet + debug snapshots. Replaces `./setup.sh --reset`.
# `pixi clean` handles the environment itself, so this only touches data.
clean = { cmd = "python -c \"import shutil,pathlib; [shutil.rmtree(p, ignore_errors=True) for p in (pathlib.Path('data'), pathlib.Path('debug'))]; print('cleared data/ and debug/')\"", cwd = "colorado_river" }

# -----------------------------------------------------------------------------
# Project: occupancy_explorer
#
# A Streamlit explorer over the occupancy GraphQL API (occupancy-backend's
# source-graphql). The HTTP client is the standard library, so the deltas are
# just Streamlit and Altair. Run with `pixi run -e occupancy <task>`.
# -----------------------------------------------------------------------------
[feature.occupancy.dependencies]
# >=1.63: streamlit 1.59.1 with pyarrow 25.0.0 segfaults while re-serialising
# chart data (see primary-residence-mesa-county/pixi.toml).
streamlit = ">=1.63"
altair = ">=5.3"
watchdog = ">=4"

[feature.occupancy.tasks]
app = { cmd = "streamlit run app.py", cwd = "occupancy_explorer" }
sync = { cmd = "python occupancy_api.py", cwd = "occupancy_explorer" }
test = { cmd = "pytest -q", cwd = "occupancy_explorer" }
lint = { cmd = "ruff check .", cwd = "occupancy_explorer" }
clean = { cmd = "python -c \"import shutil; shutil.rmtree('data', ignore_errors=True); print('cleared data/')\"", cwd = "occupancy_explorer" }

# -----------------------------------------------------------------------------
# Project: ml
#
# An MNIST pipeline: download -> train a small PyTorch network -> watch it learn
# in Streamlit. Training runs as its own process and writes runs/<id>/, so the
# dashboard can be reloaded (or closed) without killing a run.
# Run with `pixi run -e ml <task>`.
# -----------------------------------------------------------------------------
[feature.ml.dependencies]
pytorch = ">=2.3"
streamlit = ">=1.63"      # see the pyarrow note under occupancy
altair = ">=5.3"
watchdog = ">=4"
onnx = ">=1.16"           # torch.onnx.export writes this format
onnxscript = ">=0.2"      # ... and needs this to do it (the dynamo exporter)
onnxruntime = ">=1.18"    # runs the exported file, to check it matches PyTorch

[feature.ml.tasks]
app = { cmd = "streamlit run app.py", cwd = "ml" }
data = { cmd = "python mnist_data.py", cwd = "ml" }
train = { cmd = "python train.py", cwd = "ml" }
export = { cmd = "python export_onnx.py", cwd = "ml" }
web = { cmd = "python -m http.server 8000 --directory web", cwd = "ml" }
test = { cmd = "pytest -q", cwd = "ml" }
lint = { cmd = "ruff check .", cwd = "ml" }
clean = { cmd = "python -c \"import shutil; [shutil.rmtree(p, ignore_errors=True) for p in ('data', 'runs')]; print('cleared data/ and runs/')\"", cwd = "ml" }

# -----------------------------------------------------------------------------
# Project: llm
#
# Retrieval for RAG over the software-engineering guide: chunk its Markdown by
# heading, embed the chunks with a small local model, store them in LanceDB
# (an embedded database: a folder on disk, no server), and search by vector,
# keyword, or both. Run with `pixi run -e llm <task>`.
# -----------------------------------------------------------------------------
[feature.llm.dependencies]
lancedb = ">=0.25"                 # native full-text search, no tantivy needed
sentence-transformers = ">=5"      # downloads and runs the embedding models
pytorch = ">=2.3"
anthropic = ">=2.1"                # the Claude API, for the conversation phase
streamlit = ">=1.63"               # see the pyarrow note under occupancy
altair = ">=5.3"
watchdog = ">=4"

[feature.llm.tasks]
app = { cmd = "streamlit run app.py", cwd = "llm" }
index = { cmd = "python index.py", cwd = "llm" }
ask = { cmd = "python ask.py", cwd = "llm" }
compare = { cmd = "python compare.py", cwd = "llm" }
vendor = { cmd = "python vendor.py", cwd = "llm" }
zen-run = { cmd = "python -m zen.run", cwd = "llm" }
zen-score = { cmd = "python zen/score.py", cwd = "llm" }
test = { cmd = "pytest -q", cwd = "llm" }
lint = { cmd = "ruff check .", cwd = "llm" }
clean = { cmd = "python -c \"import shutil; shutil.rmtree('data', ignore_errors=True); print('cleared data/')\"", cwd = "llm" }

# -----------------------------------------------------------------------------
# Environments. `default` is what `pixi install` and a bare `pixi run` use.
#
# When the second project lands, add a sibling line, e.g.
#     houses = ["houses", "dev"]
# and students select it with `pixi run -e houses <task>`.
# -----------------------------------------------------------------------------
[environments]
default = ["colorado-river", "dev"]
colorado-river = ["colorado-river", "dev"]
occupancy = ["occupancy", "dev"]
ml = ["ml", "dev"]
llm = ["llm", "dev"]
