name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-flight run when new commits land on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The whole point of the matrix: prove pixi.toml actually solves on a
        # student's Windows laptop *natively*, with no WSL, before they find out
        # in week one. macOS covers both Apple Silicon and the Intel holdouts.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up pixi
        # No `locked:` and no `cache:` on purpose -- both require a committed
        # pixi.lock, and this repo deliberately has none (see README section 3).
        # `cache: true` is in fact a hard error without one: it builds its cache
        # key by hashing pixi.lock. Every run therefore re-solves from pixi.toml,
        # which is exactly what a student gets on a first `pixi install`. That is
        # the thing worth testing.
        uses: prefix-dev/setup-pixi@v0.10.1

      - name: Lint
        run: pixi run lint

      - name: Tests
        run: pixi run test
